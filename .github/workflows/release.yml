name: Make release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.2.9-rev1021)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git checkout --detach "${{ inputs.tag }}"

      - name: Resolve version tag
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          test -n "$tag"
          git describe --tags --exact-match >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=$tag" >> "$GITHUB_ENV"
          echo "Building $tag from $(git rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build release variants
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" \
            :app:assembleStandardRelease :app:assemblePlaystoreRelease :app:assembleFdroidRelease

      - name: Sign and stage APKs
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"
          BT_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          mkdir -p out

          sign() {
            local src="$1" dst="$2"
            test -f "$src" || { echo "::error file=$src::missing unsigned APK"; exit 1; }
            "$BT_DIR/zipalign" -p -f 4 "$src" "$dst.unaligned"
            "$BT_DIR/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$dst" "$dst.unaligned"
            rm -f "$dst.unaligned"
            "$BT_DIR/apksigner" verify --print-certs "$dst" >/dev/null
            echo "signed $(basename "$dst")"
          }

          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            sign "app/build/outputs/apk/standard/release/app-standard-${abi}-release-unsigned.apk" \
              "out/mpvEx-${VERSION}-${abi}.apk"
          done
          sign "app/build/outputs/apk/playstore/release/app-playstore-universal-release-unsigned.apk" \
            "out/mpvEx-playstore-${VERSION}.apk"
          sign "app/build/outputs/apk/fdroid/release/app-fdroid-arm64-v8a-release-unsigned.apk" \
            "out/mpvEx-fdroid-${VERSION}.apk"

          ls -lh out

      - name: Verify APK identity
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"
          BT_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          for apk in out/*.apk; do
            badging="$("$BT_DIR/aapt2" dump badging "$apk" | head -n1)"
            echo "$badging"
            echo "$badging" | grep -q "package: name='app.marlboroadvance.mpvex'"
            echo "$badging" | grep -q "versionName='${VERSION}"
          done

      - name: Write release body
        run: |
          set -euo pipefail
          {
            echo "## mpvEx ${VERSION_TAG}"
            echo
            echo "Automated build from \`${GITHUB_SHA}\`."
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo "| Asset | SHA-256 |"
            echo "| --- | --- |"
            for apk in out/*.apk; do
              echo "| $(basename "$apk") | $(sha256sum "$apk" | cut -d' ' -f1) |"
            done
            echo
            echo "### Notes"
            echo
            echo "- Package: \`app.marlboroadvance.mpvex\`"
            echo "- Signed with the project release key (APK Signature Scheme v2/v3)."
            echo "- \`mpvEx-playstore-*\` is the universal Play Store variant; \`mpvEx-fdroid-*\` is the arm64 F-Droid variant."
            echo "- See README → Changes in this fork for the feature summary."
          } > release-body.md
          cat release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: mpvEx ${{ steps.version.outputs.tag }}
          body_path: release-body.md
          files: out/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
